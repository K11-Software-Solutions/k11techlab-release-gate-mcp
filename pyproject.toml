[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "k11-release-gate-mcp"
version = "0.1.0"
description = "MCP server and CI gate for release decisions: combines UI healing, API contract, API functional, LLM red-team and JUnit evidence under a written policy into ship / conditions / needs a person / block, with an audit trail."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "K11 Software Solutions" }]
requires-python = ">=3.10"
keywords = ["mcp", "release", "quality-gate", "release-readiness", "ci", "audit", "qa", "human-in-the-loop", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["mcp>=1.20,<2", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2"]

[project.urls]
Homepage = "https://github.com/K11-Software-Solutions/k11techlab-release-gate-mcp"
Issues = "https://github.com/K11-Software-Solutions/k11techlab-release-gate-mcp/issues"

[project.scripts]
k11-release-gate-mcp = "k11_release_gate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/k11_release_gate"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
